---
version: "2.0"
services:
  web:
    image: schnetzlerjoe/snap:v0.1.0
    expose:
      - port: 3000
        as: 80
        to:
          - global: true
    env:
      - VITE_DENO_SERVERLESS_URL=
      - VITE_SNAP_VERSION=
      - VITE_RHINO_API_KEY=
      - VITE_NUMIA_API_KEY=
      - VITE_APPWRITE_URL=
      - VITE_APPWRITE_FUNCTION_PROJECT_ID=
profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 512Mi
  placement:
    dcloud:
      pricing:
        web:
          denom: uakt
          amount: 1000
deployment:
  web:
    dcloud:
      profile: web
      count: 1
