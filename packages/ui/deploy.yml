---
version: "2.0"
services:
  web:
    image: schnetzlerjoe/snap:v0.1.3
    expose:
      - port: 3000
        as: 80
        accept:
          - multisig.mysticlabs.xyz
        to:
          - global: true
    env:
      - PUBLIC_SNAP_VERSION=
      - PUBLIC_APPWRITE_URL=
      - PUBLIC_DENO_SERVERLESS_URL=
      - PUBLIC_APPWRITE_FUNCTION_PROJECT_ID=
      - PUBLIC_NUMIA_API_KEY=
profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 512Mi
  placement:
    dcloud:
      pricing:
        web:
          denom: uakt
          amount: 1000
deployment:
  web:
    dcloud:
      profile: web
      count: 1